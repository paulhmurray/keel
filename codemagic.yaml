workflows:
  macos-release:
    name: macOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    environment:
      # Pinned to the locally-tested version (see release.yml) — latest
      # stable's Dart no longer compiles the pinned pdfrx 1.3.5.
      flutter: 3.41.4
      xcode: latest
      cocoapods: default
      groups:
        - apple_credentials   # contains APP_STORE_CONNECT_* vars (see below)
        - posthog             # contains POSTHOG_API_KEY (analytics, opt-in)

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Build macOS release
        script: |
          flutter build macos --release \
            --dart-define=POSTHOG_API_KEY="$POSTHOG_API_KEY"

      - name: Sign and notarize
        script: |
          set -euo pipefail
          # Write the API private key to a file.
          # printf '%b' converts literal \n escape sequences to real newlines
          # in case Codemagic stored the key that way.
          mkdir -p /tmp/certs
          printf '%b' "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/certs/AuthKey.p8
          # Re-export so the app-store-connect CLI reads it cleanly from env
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat /tmp/certs/AuthKey.p8)"

          # Initialize keychain and create the Developer ID Application certificate
          keychain initialize
          app-store-connect certificates create \
            --type DEVELOPER_ID_APPLICATION \
            --save
          keychain add-certificates

          APP=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          echo "Signing $APP"

          # Sign with Developer ID, the hardened runtime, Keel's entitlements
          # (sandbox OFF — see Release.entitlements) and a secure timestamp.
          # A missing timestamp is the commonest notarization rejection.
          codesign \
            --deep --force --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "Developer ID Application" \
            "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # Zip for notarization submission
          ditto -c -k --keepParent "$APP" keel-notarize.zip

          # Submit to Apple's notary service and REQUIRE acceptance. The
          # old script carried on regardless, which is how 1.2.11 shipped a
          # DMG Gatekeeper blocks. On any other status, print Apple's log
          # so the failure explains itself in the build output.
          SUBMIT=$(xcrun notarytool submit keel-notarize.zip \
            --key /tmp/certs/AuthKey.p8 \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait --output-format json)
          echo "$SUBMIT"
          SUBMISSION_ID=$(echo "$SUBMIT" | jq -r '.id')
          STATUS=$(echo "$SUBMIT" | jq -r '.status')
          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization status: $STATUS — fetching Apple's log"
            xcrun notarytool log "$SUBMISSION_ID" \
              --key /tmp/certs/AuthKey.p8 \
              --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              --issuer "$APP_STORE_CONNECT_ISSUER_ID" || true
            rm -rf /tmp/certs
            exit 1
          fi

          # Staple the ticket to the .app and prove Gatekeeper accepts it.
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Package as DMG
        script: |
          set -euo pipefail
          APP=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          mkdir -p dmg_staging
          cp -R "$APP" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create \
            -volname "Keel" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            keel-macos.dmg

          # Sign and notarize the DMG as well, so the disk image itself
          # opens without a warning, then staple it.
          codesign --force --timestamp --sign "Developer ID Application" keel-macos.dmg
          SUBMIT=$(xcrun notarytool submit keel-macos.dmg \
            --key /tmp/certs/AuthKey.p8 \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait --output-format json)
          echo "$SUBMIT"
          if [ "$(echo "$SUBMIT" | jq -r '.status')" != "Accepted" ]; then
            xcrun notarytool log "$(echo "$SUBMIT" | jq -r '.id')" \
              --key /tmp/certs/AuthKey.p8 \
              --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              --issuer "$APP_STORE_CONNECT_ISSUER_ID" || true
            exit 1
          fi
          xcrun stapler staple keel-macos.dmg
          xcrun stapler validate keel-macos.dmg
          rm -rf /tmp/certs

      - name: Package as ZIP
        script: |
          APP=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          ditto -c -k --keepParent "$APP" keel-macos.zip

      - name: Upload to GitHub Release
        script: |
          REPO="paulhmurray/keel"
          TAG="$FCI_TAG"

          # Wait for GitHub Actions to create the release (up to 5 minutes)
          RELEASE_ID=""
          for i in $(seq 1 30); do
            RELEASE_ID=$(curl -sf \
              -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/tags/$TAG" \
              | jq -r '.id // empty')
            if [ -n "$RELEASE_ID" ]; then
              echo "Found release $RELEASE_ID for $TAG"
              break
            fi
            echo "Waiting for release to exist (attempt $i/30)..."
            sleep 10
          done

          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: GitHub release for $TAG not found after 5 minutes"
            exit 1
          fi

          for FILE in keel-macos.dmg keel-macos.zip; do
            echo "Uploading $FILE..."
            curl -f -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$FILE" \
              "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$FILE"
          done

    artifacts:
      - keel-macos.dmg
      - keel-macos.zip
